<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link src="jps2.css"></link>
</head>
<body>
    <div class="container">

    <!-- Dashboard Header -->
    <header id="header">
        <h1 id="heading">Monthly Expense Dashboard</h1>
        <h3 id="person"></h3>
        <p id="month"></p>
    </header>

    <!-- Income Details -->
    <h2>Income Details</h2>

    <div class="details">
        <div class="card">
            <h3>Monthly Income</h3>
            <p id="income"></p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="totalExpense"></p>
        </div>

        <div class="card">
            <h3>Remaining Balance</h3>
            <p id="balance"></p>
        </div>
    </div>

    <!-- Expense Details -->
    <h2>Expense Details</h2>

    <div id="expenseList"></div>

    <!-- Expense Summary -->
    <h2>Expense Summary</h2>

    <div class="card">
        <p id="highest"></p>
        <p id="lowest"></p>
        <p id="count"></p>
        <p id="percentage"></p>
        <p id="average"></p>
    </div>

    <h2>Financial Status</h2>

    <p id="status"></p>

    <footer>
        Personal Expense Dashboard
    </footer>

</div>
<script src="jps3.js"></script>
</body>
</html>
