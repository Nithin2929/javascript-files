<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration Form</title>
</head>
<body>
    <h1>Online Registration Form</h1>
    <form>
        <label for="Full Name">Full Name</label><br>
        <input type="text" name="" id="text"><br><br>
        <label for="Email">Email</label><br>
        <input type="Email" name="" id="Email"><br><br>
        <label for="Moblie Number">Moblie Number</label><br>
        <input type="Moblie Number" name="" id="Moblie Number"><br><br>
        <label for="DOB">DOB</label><br>
        <input type="date" name="" id="DOB"><br><br>
        <label for="Gender">Gender</label><br>
        <label class="option">
        <input type="radio" name="Gender" value="Male">Male</label>
        <label class="option">
        <input type="radio" name="Gender" value="Female">Female</label><br><br>
        <label for="Workshop Seletion">Workshop Seletion</label><br>
        <select id="workshop">
        <option value="">Select Workshop</option>
        <option value="">Web Development</option>
        <option value="">Data Analytics</option>
        <option value="">Artificial Intelligence</option>

        </select>
   
    </form>
</body>
<script src="tp.js"></script>
</html>
